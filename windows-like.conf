# Windows-like desktop behaviour for sway.
# Included from ~/.config/sway/config.

### Overlapping (floating) windows
# Every new window floats, so windows overlap and stack instead of tiling.
# Drag a window by its title bar, resize by dragging its edges, click to raise.
# $mod+Shift+space still toggles a single window back to tiling if you want it.
for_window [all] floating enable
default_border normal 2
default_floating_border normal 2
titlebar_padding 8 4
floating_minimum_size 480 x 320

# With overlapping windows, hovering must not focus/raise whatever is under the pointer.
focus_follows_mouse no
mouse_warping none

### Maximize / snap / minimize (handled by alttab.py)
# Win+Up maximizes, Win+Left/Right snaps to half the screen, Win+Down restores
# a maximized/snapped window or minimizes a normal one (Alt+Tab brings it back).
# These replace sway's default Win+arrow focus bindings; Win+h/j/k/l still move focus.
unbindsym Mod4+Up
unbindsym Mod4+Down
unbindsym Mod4+Left
unbindsym Mod4+Right
bindsym Mod4+Up nop wm up
bindsym Mod4+Down nop wm down
bindsym Mod4+Left nop wm left
bindsym Mod4+Right nop wm right

### Rename a window (handled by alttab.py)
# Right-click a title bar, or press Win+F2, to type a new title; Enter keeps it, Escape cancels,
# and clearing it goes back to the app's own title. Mouse bindings act on the window under the
# pointer, so the mark tells alttab.py which window was clicked.
bindsym --border button3 mark --add _wm_rename, nop wm rename
bindsym Mod4+F2 mark --add _wm_rename, nop wm rename

### Live wallpapers
# alttab.py tiles live wallpaper windows (see WALLPAPER_APPS there), so every floating window
# stays above them, and moves the one instance to whichever desktop is shown. That can't be a
# for_window rule: these apps' other windows share the wallpaper's app_id.

### Bluetooth
# Blueman's icon in the bar's tray: click it for the device manager. It only runs once, so
# `exec` (not exec_always) avoids starting it again on every reload.
exec blueman-applet

### File manager
# Win+E opens Thunar, like Explorer. (sway's Win+E toggles tiling split direction, which does
# nothing useful when every window floats.)
unbindsym Mod4+e
bindsym Mod4+e exec thunar

### Alt+Tab switcher (see alttab.py)
# Hold Alt, tap Tab / Shift+Tab to move the highlight, release Alt to switch.
# Arrow keys, Enter, Escape and mouse clicks also work while the switcher is open.
bindsym Mod1+Tab nop alttab next
bindsym Mod1+Shift+Tab nop alttab prev
exec_always /usr/bin/python3 /home/litsush/desktop-ui/alttab.py

### Desktops (workspaces)
# Win+1-9 switch desktops and Win+Shift+1-9 move the focused window there; Win+0 / Win+Shift+0
# do the same for desktop 10, "Junk" (all sway's defaults, from the main config). The title bar's
# "→ n" button (see alttab.py) sends a window between desktops 1 and 2.
# Desktops can be named: F2 or right-click in the Win+Tab switcher, or Win+Shift+F2 for the
# current one. A named desktop shows in the bar as "N: name"; Win+N still reaches it.
bindsym Mod4+Shift+F2 nop desktops rename

### Win+Tab desktop switcher (see alttab.py)
# Hold Win, tap Tab / Shift+Tab to move the highlight, release Win to switch desktops.
bindsym Mod4+Tab nop desktops next
bindsym Mod4+Shift+Tab nop desktops prev
